$kind: http-request
name: "Mes Inscriptions (Liste)"
order: 1000
method: GET
url: '{{base_url}}/api/inscriptions/'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "session_id": "{{session_id}}"
    }
