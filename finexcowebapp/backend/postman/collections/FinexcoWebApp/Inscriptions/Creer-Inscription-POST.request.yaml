$kind: http-request
name: "Créer une Inscription"
order: 1500
method: POST
url: '{{base_url}}/api/inscriptions/'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "session_id": "{{session_id}}"
    }
