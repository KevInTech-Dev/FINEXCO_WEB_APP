$kind: http-request
name: "Refuser un Paiement"
order: 3000
method: POST
url: '{{base_url}}/api/paiements/{{paiement_id}}/refuser/'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "motif": "Preuve de paiement illisible ou invalide."
    }
